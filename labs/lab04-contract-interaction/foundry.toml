[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Ex. 7.5: optimizer-ul, în două variante (FOUNDRY_PROFILE=opt1 / FOUNDRY_PROFILE=opt1m)
[profile.opt1]
optimizer = true
optimizer_runs = 1

[profile.opt1m]
optimizer = true
optimizer_runs = 1000000
